[package]
name = "dadabada"
version = "0.1.5"
edition = "2021"
description = "DADABADA: a lightweight schemaless record database server"
license = "Apache-2.0"

# The program is called ddbd; the package and the application stay DADABADA.
[[bin]]
name = "ddbd"
path = "src/main.rs"

[dependencies]
rocksdb = { version = "0.25", default-features = false, features = ["lz4", "zstd", "bindgen-runtime"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "0.8"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
rustyline = "14"
shlex = "1"
unicode-normalization = "0.1"
caseless = "0.2"
unicode-script = "0.5"
unicode-properties = "0.1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
