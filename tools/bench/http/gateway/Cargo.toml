[package]
name = "sqlgw"
version = "0.1.0"
edition = "2021"
description = "Benchmark only: puts PostgreSQL or SQLite behind the same HTTP JSON API shape as DDBD's getRecords"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
postgres = "0.19"
rusqlite = { version = "0.32", features = ["bundled"] }
mongodb = { version = "2.8", default-features = false, features = ["sync"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[workspace]
